version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        # react's type packages must ship in the react group so the runtime
        # and typings never drift to mismatched versions again.
        exclude-patterns:
          - "@types/react*"
      react:
        # react and react-dom are version-locked: a split bump (#10 alone)
        # crashed the app on mount because react-dom 19.2.7 cannot pair with
        # react 19.3.0.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /services/ocr-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    # Base image major bumps must be deliberate: they are bounded by each
    # service's requires-python contract and the frozen uv.lock toolchain.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /services/ocr-worker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Action majors need migration review, not an always-red weekly PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
