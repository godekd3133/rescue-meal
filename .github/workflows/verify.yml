name: Verify Rescue Meal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web runtime, build, and Sites worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check protected mobile runtime
        run: npm run check:runtime

      - name: Build demo client and worker
        env:
          VITE_DEPLOYMENT_MODE: demo
        run: npm run build

      - name: Build production client with fail-closed API configuration
        env:
          VITE_DEPLOYMENT_MODE: production
          VITE_API_BASE_URL: https://api.ci.rescue-meal.invalid
          VITE_APP_VERSION: ci-production
        run: npm run build

      - name: Test release manifest contract
        run: npm run test:release-manifest

      - name: Create release manifest
        env:
          VITE_DEPLOYMENT_MODE: production
        run: npm run release:manifest -- --output /tmp/rescue-meal-release-manifest.json --require-artifacts

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: rescue-meal-release-manifest-${{ github.run_id }}
          path: /tmp/rescue-meal-release-manifest.json
          if-no-files-found: error

      - name: Install Chromium for fixture/mobile runtime tests
        run: npx playwright install --with-deps chromium

      - name: Run fixture/mobile runtime tests
        run: npm run test:runtime

      - name: Run native 320px viewport regression
        env:
          NATIVE_RUNTIME_TEST_PORT: 4481
        run: npm run test:native

      - name: Test authoritative mutation readback contract
        run: npm run test:mutation-readback

      - name: Test optimistic mutation contract
        run: npm run test:optimistic-mutation

      - name: Test storage mutation recovery contract
        run: npm run test:storage-mutation-recovery

      - name: Test Sites worker output
        run: npm run test:sites

      - name: Test workspace sync coordinator
        run: npm run test:workspace-sync

      - name: Test service worker contract
        run: npm run test:service-worker

  connected-e2e:
    name: Connected browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.12"

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run connected E2E with disposable API workspace
        run: npm run test:connected

  api:
    name: FastAPI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.12"

      - name: Install API dependencies
        run: uv sync --frozen

      - name: Run API tests
        run: uv run pytest

      - name: Run production configuration preflight fixture
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue:ci-password@db:5432/rescue_meal
          RESCUE_MEAL_INVENTORY_MODE: normalized
          RESCUE_MEAL_AUTH_REQUIRED: "true"
          RESCUE_MEAL_AUTH_SECRET: production-ci-secret-0123456789-abcdef-012345
          RESCUE_MEAL_OBSERVABILITY_TOKEN: production-observability-secret-0123456789-abcdef
          RESCUE_MEAL_AUTH_RATE_LIMIT_ENABLED: "true"
          RESCUE_MEAL_CORS_ORIGINS: https://meal.example.com
          RESCUE_MEAL_OCR_URL: http://ocr-worker:8002
          RESCUE_MEAL_POSTGRES_PROCESS_COUNT: "1"
          RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS: "10"
          RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS: "100"
          RESCUE_MEAL_PASSWORD_RESET_BASE_URL: https://meal.example.com/reset
          RESCUE_MEAL_EMAIL_PROVIDER_URL: https://email.example.com/send
          RESCUE_MEAL_EMAIL_PROVIDER_TOKEN: ci-provider-token
          POSTGRES_PASSWORD: ci-postgres-password
          RESCUE_MEAL_ENABLE_EXTERNAL_LOOKUPS: "true"
          MFDS_API_KEY: ci-mfds-key
          RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN: ci-product-worker-token
          RESCUE_MEAL_OPEN_FOOD_FACTS_USER_AGENT: "RescueMeal/1.0 (ci@example.org)"
          RESCUE_MEAL_RECIPE_ADMIN_EMAILS: reviewer@example.org,publisher@example.org
          RESCUE_MEAL_RECIPE_PUBLISHER_EMAILS: publisher@example.org
        run: uv run python scripts/preflight_production.py --mode production

      - name: Reject invalid recipe publisher configuration
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue:ci-password@db:5432/rescue_meal
          RESCUE_MEAL_INVENTORY_MODE: normalized
          RESCUE_MEAL_AUTH_REQUIRED: "true"
          RESCUE_MEAL_AUTH_SECRET: production-ci-secret-0123456789-abcdef-012345
          RESCUE_MEAL_OBSERVABILITY_TOKEN: production-observability-secret-0123456789-abcdef
          RESCUE_MEAL_AUTH_RATE_LIMIT_ENABLED: "true"
          RESCUE_MEAL_CORS_ORIGINS: https://meal.example.com
          RESCUE_MEAL_OCR_URL: http://ocr-worker:8002
          RESCUE_MEAL_POSTGRES_PROCESS_COUNT: "1"
          RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS: "10"
          RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS: "100"
          RESCUE_MEAL_PASSWORD_RESET_BASE_URL: https://meal.example.com/reset
          RESCUE_MEAL_EMAIL_PROVIDER_URL: https://email.example.com/send
          RESCUE_MEAL_EMAIL_PROVIDER_TOKEN: ci-provider-token
          POSTGRES_PASSWORD: ci-postgres-password
          RESCUE_MEAL_ENABLE_EXTERNAL_LOOKUPS: "true"
          MFDS_API_KEY: ci-mfds-key
          RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN: ci-product-worker-token
          RESCUE_MEAL_OPEN_FOOD_FACTS_USER_AGENT: "RescueMeal/1.0 (ci@example.org)"
          RESCUE_MEAL_RECIPE_ADMIN_EMAILS: reviewer@example.org
          RESCUE_MEAL_RECIPE_PUBLISHER_EMAILS: publisher@example.org
        run: |
          set +e
          uv run python scripts/preflight_production.py --mode production > /tmp/rescue-meal-invalid-recipe-preflight.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'recipe-publisher-not-admin' /tmp/rescue-meal-invalid-recipe-preflight.log
          ! grep -q 'publisher@example.org' /tmp/rescue-meal-invalid-recipe-preflight.log

      - name: Build API image and load packaged recipe catalog
        working-directory: .
        run: |
          docker build --file services/api/Dockerfile --tag rescue-meal-api:ci .
          docker run --rm rescue-meal-api:ci python -c "from app.planner import load_recipe_specs; assert len(load_recipe_specs()) == 53"

  ocr-worker:
    name: OCR worker tests and amd64 image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ocr-worker
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.12"

      - name: Install OCR worker dependencies
        run: uv sync --frozen

      - name: Run OCR worker tests
        run: uv run pytest

      - name: Build amd64 OCR worker image
        working-directory: .
        run: docker build --platform linux/amd64 --tag rescue-meal-ocr-worker:ci services/ocr-worker

  container-boot:
    name: Production-shaped container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run disposable Compose boot and read-write smoke
        run: sh infra/container-smoke.sh

  postgres-live:
    name: Live PostgreSQL normalized smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rescue_meal
          POSTGRES_USER: rescue_meal
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rescue_meal -d rescue_meal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: "3.12"

      - name: Verify portable PostgreSQL client wrapper
        run: sh ../../infra/postgres/client-contract.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client-16

      - name: Install API dependencies
        run: uv sync --frozen

      - name: Apply ordered migrations
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal
        run: sh ../../infra/postgres/migrate.sh --apply

      - name: Re-run migrations through checksum ledger
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal
        run: |
          set -eu
          sh ../../infra/postgres/migrate.sh --apply > /tmp/rescue-meal-migration-rerun.log
          grep -q 'Already applied 022_receipt_review_metadata.sql' /tmp/rescue-meal-migration-rerun.log
          grep -q 'Already applied 023_manual_food_idempotency.sql' /tmp/rescue-meal-migration-rerun.log
          grep -q 'Already applied 024_recipe_catalog_revision.sql' /tmp/rescue-meal-migration-rerun.log
          grep -q 'Already applied 025_storage_locations.sql' /tmp/rescue-meal-migration-rerun.log
          grep -q 'Already applied 026_export_audit.sql' /tmp/rescue-meal-migration-rerun.log
          test "$(psql --no-psqlrc --no-password --tuples-only --no-align --dbname "$RESCUE_MEAL_DATABASE_URL" --command 'SELECT COUNT(*) FROM rescue_schema_migrations;')" = 26

      - name: Verify authentication helper retention
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal
        run: uv run python scripts/postgres_auth_retention_smoke.py

      - name: Verify PostgreSQL aggregate connection budget
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal
          RESCUE_MEAL_POSTGRES_PROCESS_COUNT: "1"
          RESCUE_MEAL_POSTGRES_POOL_MAX_SIZE: "8"
          RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS: "10"
          RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS: "100"
        run: |
          set -eu
          actual_max="$(psql --no-psqlrc --no-password --tuples-only --no-align --dbname "$RESCUE_MEAL_DATABASE_URL" --command 'SHOW max_connections;')"
          test "$actual_max" = "$RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS"
          required=$((RESCUE_MEAL_POSTGRES_PROCESS_COUNT * (2 + RESCUE_MEAL_POSTGRES_POOL_MAX_SIZE) + RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS))
          test "$required" -le "$actual_max"
          current="$(psql --no-psqlrc --no-password --tuples-only --no-align --dbname "$RESCUE_MEAL_DATABASE_URL" --command 'SELECT count(*) FROM pg_stat_activity WHERE datname = current_database();')"
          printf 'PostgreSQL connection budget passed: required=%s max=%s current=%s\n' "$required" "$actual_max" "$current"

      - name: Run normalized API readiness and read-write smoke
        env:
          RESCUE_MEAL_DATABASE_URL: postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal
          RESCUE_MEAL_INVENTORY_MODE: normalized
          RESCUE_MEAL_AUTH_REQUIRED: "true"
          RESCUE_MEAL_AUTH_SECRET: ci-live-auth-secret-0123456789-abcdef
          RESCUE_MEAL_OBSERVABILITY_TOKEN: ci-live-observability-secret-0123456789-abcdef
          RESCUE_MEAL_AUTH_RATE_LIMIT_ENABLED: "true"
          RESCUE_MEAL_CORS_ORIGINS: https://meal.example.com
          RESCUE_MEAL_ENVIRONMENT: ci
        run: |
          set -eu
          api_log=/tmp/rescue-meal-live-api.log
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$api_log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready_file=/tmp/rescue-meal-live-ready.json
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready >"$ready_file"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$api_log"
            exit 1
          fi
          jq --exit-status '(.status == "ready") and (.database == "ok") and (.storage == "postgresql-normalized-inventory") and (.auth_required == true)' "$ready_file"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $RESCUE_MEAL_OBSERVABILITY_TOKEN" \
            http://127.0.0.1:8000/api/internal/metrics > /tmp/rescue-meal-live-metrics.txt
          grep -q 'rescue_meal_http_requests_total' /tmp/rescue-meal-live-metrics.txt
          grep -q 'rescue_meal_http_request_duration_seconds_bucket' /tmp/rescue-meal-live-metrics.txt
          ! grep -q "$RESCUE_MEAL_OBSERVABILITY_TOKEN" /tmp/rescue-meal-live-metrics.txt

          guest_payload=$(curl --fail --silent --show-error --request POST http://127.0.0.1:8000/api/auth/guest)
          guest_token=$(printf '%s' "$guest_payload" | jq -r '.access_token // empty')
          test -n "$guest_token"
          auth_header="Authorization: Bearer $guest_token"
          workspace_id=$(curl --fail --silent --show-error --header "$auth_header" http://127.0.0.1:8000/api/auth/me | jq -r '.workspace_id // empty')
          test -n "$workspace_id"

          curl --fail --silent --show-error --header "$auth_header" http://127.0.0.1:8000/api/dashboard > /tmp/rescue-meal-live-dashboard-before.json
          jq --exit-status '(.food_count == 7) and ((.inventory | length) == 7)' /tmp/rescue-meal-live-dashboard-before.json

          revision_before=$(curl --fail --silent --show-error --header "$auth_header" \
            http://127.0.0.1:8000/api/storage-locations/revision | jq -r '.revision')
          test "$revision_before" -ge 0

          storage_location_response=/tmp/rescue-meal-live-storage-location.json
          curl --fail --silent --show-error --request POST \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data '{"name":"CI 냉장 선반","storage_type":"refrigerated"}' \
            http://127.0.0.1:8000/api/storage-locations > "$storage_location_response"
          jq --exit-status '(.name == "CI 냉장 선반") and (.storage_type == "refrigerated")' "$storage_location_response"
          storage_location_id=$(jq -r '.id' "$storage_location_response")
          test -n "$storage_location_id"
          revision_after=$(curl --fail --silent --show-error --header "$auth_header" \
            http://127.0.0.1:8000/api/storage-locations/revision | jq -r '.revision')
          test "$revision_after" -gt "$revision_before"

          food_response=/tmp/rescue-meal-live-food.json
          curl --fail --silent --show-error --request POST \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "{\"canonical_name\":\"CI 테스트 식품\",\"quantity\":1,\"unit\":\"개\",\"storage_type\":\"refrigerated\",\"storage_location_id\":\"$storage_location_id\",\"category\":\"테스트\",\"note\":\"live normalized smoke\",\"applicable_storage_type\":\"refrigerated\",\"storage_condition_text\":\"0~10℃ 냉장보관\",\"product_provenance\":{\"source\":\"local_fixture\",\"source_url\":null,\"confidence\":0.99,\"note\":\"CI reviewed candidate\",\"storage_hint\":\"refrigerated\",\"source_freshness\":\"current\"}}" \
            http://127.0.0.1:8000/api/foods > "$food_response"
          jq --exit-status --arg storage_location_id "$storage_location_id" '(.canonical_name == "CI 테스트 식품") and (.storage_location_id == $storage_location_id) and (.product_provenance.source == "local_fixture") and (.date_assertion.kind == "unknown") and (.date_assertion.applicable_storage_type == "refrigerated") and (.date_assertion.storage_condition_text == "0~10℃ 냉장보관")' "$food_response"
          food_id=$(jq -r '.id' "$food_response")
          curl --fail --silent --show-error --header "$auth_header" \
            "http://127.0.0.1:8000/api/foods/$food_id/product-provenance/events" \
            | jq --exit-status '(. | length == 1) and (.[0].action == "applied") and (.[0].after.source == "local_fixture")'

          curl --fail --silent --show-error --request PATCH \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data '{"canonical_name":"CI 사용자 확인 식품","brand":"확인한 브랜드","category":"가공식품"}' \
            "http://127.0.0.1:8000/api/foods/$food_id/product-info" \
            > /tmp/rescue-meal-live-food-corrected.json
          jq --exit-status '(.canonical_name == "CI 사용자 확인 식품") and (.brand == "확인한 브랜드") and (.category == "가공식품") and (.quantity == 1) and (.storage_type == "refrigerated") and (.product_provenance == null) and (.date_assertion.kind == "unknown")' /tmp/rescue-meal-live-food-corrected.json
          curl --fail --silent --show-error --header "$auth_header" \
            "http://127.0.0.1:8000/api/foods/$food_id/product-info/events" \
            | jq --exit-status '(. | length == 1) and (.[0].action == "updated") and (.[0].before.canonical_name == "CI 테스트 식품") and (.[0].after.canonical_name == "CI 사용자 확인 식품") and (.[0].after.product_provenance == null)'
          curl --fail --silent --show-error --header "$auth_header" \
            "http://127.0.0.1:8000/api/foods/$food_id/product-provenance/events" \
            | jq --exit-status '(. | length == 2) and (.[0].action == "removed") and (.[0].after == null)'

          curl --fail --silent --show-error --header "$auth_header" \
            "http://127.0.0.1:8000/api/inventory/search?q=CI%20%ED%85%8C%EC%8A%A4%ED%8A%B8&storage_location_id=$storage_location_id&offset=0&limit=10" \
            | jq --exit-status --arg storage_location_id "$storage_location_id" '(.total == 1) and (.items[0].canonical_name == "CI 테스트 식품") and (.items[0].storage_location_id == $storage_location_id) and (.storage_location_id == $storage_location_id) and (.has_more == false)'

          curl --fail --silent --show-error --header "$auth_header" http://127.0.0.1:8000/api/dashboard > /tmp/rescue-meal-live-dashboard-after.json
          jq --exit-status --arg storage_location_id "$storage_location_id" '(.food_count == 8) and ((.storage_locations | map(select(.id == $storage_location_id and .name == "CI 냉장 선반")) | length) == 1) and ((.inventory | map(select(.canonical_name == "CI 테스트 식품" and .storage_location_id == $storage_location_id and .product_provenance.source == "local_fixture")) | length) == 1)' /tmp/rescue-meal-live-dashboard-after.json

          backup_file=/tmp/rescue-meal-live-backup.dump
          RESCUE_MEAL_DATABASE_URL=postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal \
            sh ../../infra/postgres/backup.sh --output "$backup_file"
          test "$(stat -c '%a' "$backup_file" 2>/dev/null || stat -f '%Lp' "$backup_file")" = "600"
          psql --no-psqlrc --no-password --set ON_ERROR_STOP=1 \
            --dbname "$RESCUE_MEAL_DATABASE_URL" \
            --command 'CREATE DATABASE rescue_meal_restore;'
          restore_database_url=postgresql://rescue_meal:ci-postgres-password@127.0.0.1:5432/rescue_meal_restore
          RESCUE_MEAL_DATABASE_URL="$restore_database_url" \
            sh ../../infra/postgres/restore.sh --input "$backup_file" --confirm-restore
          restored_lot_count=$(psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$restore_database_url" \
            --command "SELECT count(*) FROM rescue_inventory_lots;")
          test "$restored_lot_count" -ge 1
          psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$restore_database_url" \
            --command "SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'rescue_inventory_date_assertions' AND column_name = 'storage_condition_text';" \
            | grep -qx '1'
          psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$restore_database_url" \
            --command "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'rescue_api_storage_locations';" \
            | grep -qx '1'
          restored_location_count=$(psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$restore_database_url" \
            --command "SELECT count(*) FROM rescue_api_storage_locations WHERE workspace_id = '$workspace_id' AND payload ->> 'id' = '$storage_location_id' AND payload ->> 'name' = 'CI 냉장 선반';")
          test "$restored_location_count" = 1
          restored_lot_location_count=$(psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$restore_database_url" \
            --command "SELECT count(*) FROM rescue_inventory_lots WHERE workspace_id = '$workspace_id' AND lot_id = '$food_id' AND storage_location_id = '$storage_location_id';")
          test "$restored_lot_location_count" = 1

          curl --fail --silent --show-error --request POST \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: ci-custom-location-history-1' \
            --data '{"event_type":"moved","to_storage_type":"ambient"}' \
            "http://127.0.0.1:8000/api/foods/$food_id/storage-events" \
            | jq --exit-status --arg food_id "$food_id" '(.food_id == $food_id) and (.from_storage_location_id != null) and (.to_storage_location_id == null)'
          history_delete_status=$(curl --silent --show-error --output /tmp/rescue-meal-live-history-delete.json --write-out '%{http_code}' \
            --request DELETE --header "$auth_header" \
            "http://127.0.0.1:8000/api/storage-locations/$storage_location_id")
          test "$history_delete_status" = 409
          jq --exit-status '.detail.code == "storage_location_in_use"' /tmp/rescue-meal-live-history-delete.json

          uv run python scripts/postgres_concurrency_smoke.py
          RESCUE_MEAL_MULTIPROCESS_RECEIVE_ROUNDS=4 uv run python scripts/postgres_multiprocess_receive_smoke.py
          uv run python scripts/postgres_crash_recovery_smoke.py
          uv run python scripts/postgres_post_commit_crash_smoke.py
          uv run python scripts/postgres_receipt_commit_idempotency_smoke.py
          uv run python scripts/postgres_account_deletion_smoke.py
          uv run python scripts/postgres_account_deletion_crash_recovery_smoke.py
          RESCUE_MEAL_CONNECTION_RECOVERY_PORT=18191 uv run python scripts/postgres_connection_recovery_smoke.py
          uv run python scripts/postgres_receipt_draft_idempotency_smoke.py
          uv run python scripts/postgres_meal_plan_idempotency_smoke.py
          uv run python scripts/postgres_manual_food_lot_smoke.py

          account_email=postgres-live@example.com
          initial_password=initial-ci-password
          changed_password=changed-ci-password
          register_file=/tmp/rescue-meal-live-account-register.json
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$account_email\",\"password\":\"$initial_password\"}" \
            http://127.0.0.1:8000/api/auth/register > "$register_file"
          jq --exit-status '(.mode == "account") and (.email == "postgres-live@example.com") and (.workspace_id | startswith("account-")) and (.access_token | length > 40)' "$register_file"
          account_token=$(jq -r '.access_token' "$register_file")
          account_workspace=$(jq -r '.workspace_id' "$register_file")
          account_header="Authorization: Bearer $account_token"

          account_food_file=/tmp/rescue-meal-live-account-food.json
          curl --fail --silent --show-error --request POST \
            --header "$account_header" \
            --header 'Content-Type: application/json' \
            --data '{"canonical_name":"PostgreSQL 인증 식품","quantity":1,"unit":"개","storage_type":"ambient","category":"테스트","note":"persistent auth smoke"}' \
            http://127.0.0.1:8000/api/foods > "$account_food_file"
          jq --exit-status '(.canonical_name == "PostgreSQL 인증 식품") and (.quantity == 1)' "$account_food_file"

          curl --fail --silent --show-error --header "$account_header" \
            http://127.0.0.1:8000/api/auth/me \
            | jq --exit-status '(.mode == "account") and (.workspace_id | startswith("account-")) and (.email == "postgres-live@example.com")'
          curl --fail --silent --show-error --header "$account_header" \
            http://127.0.0.1:8000/api/account/export \
            | jq --exit-status '(.schema_version == "rescue-meal-export-v1") and ((.inventory | map(select(.canonical_name == "PostgreSQL 인증 식품")) | length) == 1) and (.workspace_id | startswith("account-"))'

          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$api_log" 2>&1 &
          api_pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready >"$ready_file"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$api_log"
            exit 1
          fi

          login_file=/tmp/rescue-meal-live-account-login.json
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$account_email\",\"password\":\"$initial_password\"}" \
            http://127.0.0.1:8000/api/auth/login > "$login_file"
          jq --exit-status --arg expected_workspace "$account_workspace" \
            '(.mode == "account") and (.workspace_id == $expected_workspace)' "$login_file"
          restarted_token=$(jq -r '.access_token' "$login_file")
          restarted_header="Authorization: Bearer $restarted_token"
          curl --fail --silent --show-error --header "$restarted_header" \
            http://127.0.0.1:8000/api/dashboard \
            | jq --exit-status '(.food_count == 1) and (.inventory[0].canonical_name == "PostgreSQL 인증 식품")'

          changed_file=/tmp/rescue-meal-live-account-password-change.json
          curl --fail --silent --show-error --request POST \
            --header "$restarted_header" \
            --header 'Content-Type: application/json' \
            --data "{\"current_password\":\"$initial_password\",\"new_password\":\"$changed_password\"}" \
            http://127.0.0.1:8000/api/auth/password/change > "$changed_file"
          jq --exit-status '(.mode == "account") and (.workspace_id | startswith("account-")) and (.access_token | length > 40)' "$changed_file"
          changed_token=$(jq -r '.access_token' "$changed_file")
          changed_header="Authorization: Bearer $changed_token"

          old_status=$(curl --silent --show-error --output /tmp/rescue-meal-live-old-token-response.json --write-out '%{http_code}' \
            --header "$restarted_header" http://127.0.0.1:8000/api/auth/me)
          test "$old_status" = "401"
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$account_email\",\"password\":\"$changed_password\"}" \
            http://127.0.0.1:8000/api/auth/login \
            | jq --exit-status --arg expected_workspace "$account_workspace" '(.mode == "account") and (.workspace_id == $expected_workspace)'

          curl --fail --silent --show-error --request POST \
            --header "$changed_header" \
            --header 'Content-Type: application/json' \
            --data "{\"current_password\":\"$changed_password\",\"confirmation\":\"DELETE\"}" \
            http://127.0.0.1:8000/api/account/delete \
            | jq --exit-status '(.status == "deleted")'
          deleted_status=$(curl --silent --show-error --output /tmp/rescue-meal-live-deleted-token-response.json --write-out '%{http_code}' \
            --header "$changed_header" http://127.0.0.1:8000/api/auth/me)
          test "$deleted_status" = "401"
          account_rows=$(psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$RESCUE_MEAL_DATABASE_URL" \
            --command "SELECT count(*) FROM rescue_auth_accounts WHERE workspace_id = '$account_workspace';")
          test "$account_rows" = "0"
          workspace_food_rows=$(psql --no-psqlrc --no-password --tuples-only --no-align \
            --dbname "$RESCUE_MEAL_DATABASE_URL" \
            --command "SELECT count(*) FROM rescue_api_foods WHERE workspace_id = '$account_workspace';")
          test "$workspace_food_rows" = "0"

          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true
          uv run python scripts/postgres_connection_lifecycle_smoke.py
          uv run python scripts/postgres_pool_smoke.py

  source:
    name: Python source compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile API and OCR worker sources
        run: python -m compileall -q services/api/app services/api/scripts services/ocr-worker/app

  infra:
    name: Compose and migration configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate default Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate Grocy, notification, product enrichment workers, and normalized inventory wiring
        run: docker compose --profile grocy --profile notifications --profile product-enrichment -f infra/docker-compose.yml config --quiet

      - name: Validate ordered PostgreSQL migration plan
        run: sh infra/postgres/migrate.sh --dry-run
