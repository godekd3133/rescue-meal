name: Disaster-recovery drill

on:
  schedule:
    # Weekly so a backup/restore regression surfaces even without pushes.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dr-drill:
    name: End-to-end backup/restore recoverability drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run disposable disaster-recovery drill
        run: sh infra/dr-drill.sh
