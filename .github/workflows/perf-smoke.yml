name: Performance baseline smoke

on:
  schedule:
    # Weekly so a latency/throughput regression surfaces even without pushes.
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Disposable-stack latency and idempotency baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run disposable performance baseline smoke
        run: sh infra/perf-smoke.sh
