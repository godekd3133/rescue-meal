name: Publish container images

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/ocr-worker/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          # The API Dockerfile COPYs services/api/* and data/fixtures/recipes,
          # so the build context is the repository root (same as the
          # security-scan job).
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64
          push: true
          # Provenance attestations made trivy scan referenced base layers
          # (see security-scan.yml history); keep the published image flat.
          provenance: false
          tags: |
            ghcr.io/godekd3133/rescue-meal-api:main
            ghcr.io/godekd3133/rescue-meal-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  ocr-worker:
    name: Build and push OCR worker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCR worker image
        uses: docker/build-push-action@v6
        with:
          context: services/ocr-worker
          file: services/ocr-worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/godekd3133/rescue-meal-ocr-worker:main
            ghcr.io/godekd3133/rescue-meal-ocr-worker:${{ github.sha }}
          cache-from: type=gha,scope=ocr-worker
          cache-to: type=gha,mode=max,scope=ocr-worker
