name: rescue-meal

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescue_meal}
      POSTGRES_USER: ${POSTGRES_USER:-rescue_meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rescue_meal_pgdata:/var/lib/postgresql/data
      - ./postgres/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ocr-worker:
    build:
      context: ../services/ocr-worker
    restart: unless-stopped
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    ports:
      - "${OCR_WORKER_PORT:-8002}:8002"
    volumes:
      - rescue_meal_paddlex_cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 12

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      RESCUE_MEAL_DATABASE_URL: postgresql://${POSTGRES_USER:-rescue_meal}:${POSTGRES_PASSWORD:-change-me-in-local-env}@db:5432/${POSTGRES_DB:-rescue_meal}
      RESCUE_MEAL_OCR_URL: http://ocr-worker:8002
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ocr-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rescue_meal_pgdata:
  rescue_meal_paddlex_cache:
