name: rescue-meal

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescue_meal}
      POSTGRES_USER: ${POSTGRES_USER:-rescue_meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rescue_meal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: "no"
    command: ["uv", "run", "--no-dev", "python", "/migrations/migrate.py"]
    environment:
      RESCUE_MEAL_DATABASE_URL: postgresql://${POSTGRES_USER:-rescue_meal}:${POSTGRES_PASSWORD:-change-me-in-local-env}@db:5432/${POSTGRES_DB:-rescue_meal}
    volumes:
      - ./postgres:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  ocr-worker:
    # The pinned PaddlePaddle CPU wheel is linux/amd64. Docker Desktop can run
    # this image under emulation on Apple Silicon; production should schedule
    # it on an amd64 node or provide a separately validated ARM runtime.
    platform: linux/amd64
    build:
      context: ../services/ocr-worker
    restart: unless-stopped
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      # PaddleOCR is CPU-bound in the default image. Keep one inference per
      # process unless a measured deployment explicitly raises this bound.
      RESCUE_MEAL_OCR_MAX_CONCURRENCY: ${RESCUE_MEAL_OCR_MAX_CONCURRENCY:-1}
      RESCUE_MEAL_OCR_QUEUE_TIMEOUT_SECONDS: ${RESCUE_MEAL_OCR_QUEUE_TIMEOUT_SECONDS:-2}
    ports:
      - "${OCR_WORKER_PORT:-8002}:8002"
    volumes:
      - rescue_meal_paddlex_cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready').read()"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      RESCUE_MEAL_ENVIRONMENT: ${RESCUE_MEAL_ENVIRONMENT:-local}
      RESCUE_MEAL_DATABASE_URL: postgresql://${POSTGRES_USER:-rescue_meal}:${POSTGRES_PASSWORD:-change-me-in-local-env}@db:5432/${POSTGRES_DB:-rescue_meal}
      RESCUE_MEAL_ALLOW_RUNTIME_SCHEMA_DDL: ${RESCUE_MEAL_ALLOW_RUNTIME_SCHEMA_DDL:-false}
      RESCUE_MEAL_INVENTORY_MODE: ${RESCUE_MEAL_INVENTORY_MODE:-normalized}
      RESCUE_MEAL_WORKSPACE_STORE_CACHE_SIZE: ${RESCUE_MEAL_WORKSPACE_STORE_CACHE_SIZE:-16}
      # Set PROCESS_COUNT to the maximum concurrently running API processes,
      # including old and new processes during a rolling deploy. MAX_CONNECTIONS
      # must match the managed PostgreSQL setting; production preflight checks
      # PROCESS_COUNT * (2 base/auth + pool max) + reserved <= max_connections.
      RESCUE_MEAL_POSTGRES_PROCESS_COUNT: ${RESCUE_MEAL_POSTGRES_PROCESS_COUNT:-1}
      RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS: ${RESCUE_MEAL_POSTGRES_RESERVED_CONNECTIONS:-10}
      RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS: ${RESCUE_MEAL_POSTGRES_MAX_CONNECTIONS:-}
      RESCUE_MEAL_POSTGRES_POOL_MIN_SIZE: ${RESCUE_MEAL_POSTGRES_POOL_MIN_SIZE:-1}
      RESCUE_MEAL_POSTGRES_POOL_MAX_SIZE: ${RESCUE_MEAL_POSTGRES_POOL_MAX_SIZE:-8}
      RESCUE_MEAL_POSTGRES_POOL_TIMEOUT_SECONDS: ${RESCUE_MEAL_POSTGRES_POOL_TIMEOUT_SECONDS:-5}
      RESCUE_MEAL_POSTGRES_POOL_MAX_WAITING: ${RESCUE_MEAL_POSTGRES_POOL_MAX_WAITING:-64}
      RESCUE_MEAL_POSTGRES_POOL_MAX_IDLE_SECONDS: ${RESCUE_MEAL_POSTGRES_POOL_MAX_IDLE_SECONDS:-300}
      RESCUE_MEAL_POSTGRES_POOL_MAX_LIFETIME_SECONDS: ${RESCUE_MEAL_POSTGRES_POOL_MAX_LIFETIME_SECONDS:-1800}
      RESCUE_MEAL_POSTGRES_POOL_RECONNECT_TIMEOUT_SECONDS: ${RESCUE_MEAL_POSTGRES_POOL_RECONNECT_TIMEOUT_SECONDS:-30}
      RESCUE_MEAL_POSTGRES_POOL_CLOSE_TIMEOUT_SECONDS: ${RESCUE_MEAL_POSTGRES_POOL_CLOSE_TIMEOUT_SECONDS:-5}
      RESCUE_MEAL_POSTGRES_DIRECT_RECONNECT_TIMEOUT_SECONDS: ${RESCUE_MEAL_POSTGRES_DIRECT_RECONNECT_TIMEOUT_SECONDS:-5}
      RESCUE_MEAL_AUTH_SECRET: ${RESCUE_MEAL_AUTH_SECRET:-}
      RESCUE_MEAL_AUTH_REQUIRED: ${RESCUE_MEAL_AUTH_REQUIRED:-true}
      RESCUE_MEAL_AUTH_RATE_LIMIT_ENABLED: ${RESCUE_MEAL_AUTH_RATE_LIMIT_ENABLED:-true}
      RESCUE_MEAL_AUTH_RATE_LIMIT_MAX_REQUESTS: ${RESCUE_MEAL_AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      RESCUE_MEAL_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${RESCUE_MEAL_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      RESCUE_MEAL_ACCESS_LOG: ${RESCUE_MEAL_ACCESS_LOG:-true}
      RESCUE_MEAL_CLIENT_ERROR_LOG: ${RESCUE_MEAL_CLIENT_ERROR_LOG:-true}
      RESCUE_MEAL_CLIENT_ERROR_RATE_LIMIT_MAX_REQUESTS: ${RESCUE_MEAL_CLIENT_ERROR_RATE_LIMIT_MAX_REQUESTS:-30}
      RESCUE_MEAL_CLIENT_ERROR_RATE_LIMIT_WINDOW_SECONDS: ${RESCUE_MEAL_CLIENT_ERROR_RATE_LIMIT_WINDOW_SECONDS:-60}
      RESCUE_MEAL_OBSERVABILITY_TOKEN: ${RESCUE_MEAL_OBSERVABILITY_TOKEN:-}
      RESCUE_MEAL_CORS_ORIGINS: ${RESCUE_MEAL_CORS_ORIGINS:-}
      RESCUE_MEAL_OCR_URL: http://ocr-worker:8002
      RESCUE_MEAL_INFERENCE_PROVIDER: ${RESCUE_MEAL_INFERENCE_PROVIDER:-rules}
      RESCUE_MEAL_OLLAMA_BASE_URL: ${RESCUE_MEAL_OLLAMA_BASE_URL:-http://ollama:11434}
      RESCUE_MEAL_OLLAMA_MODEL: ${RESCUE_MEAL_OLLAMA_MODEL:-gemma4}
      RESCUE_MEAL_OLLAMA_TIMEOUT_SECONDS: ${RESCUE_MEAL_OLLAMA_TIMEOUT_SECONDS:-8}
      RESCUE_MEAL_PASSWORD_RESET_BASE_URL: ${RESCUE_MEAL_PASSWORD_RESET_BASE_URL:-}
      RESCUE_MEAL_EMAIL_PROVIDER_URL: ${RESCUE_MEAL_EMAIL_PROVIDER_URL:-}
      RESCUE_MEAL_EMAIL_PROVIDER_TOKEN: ${RESCUE_MEAL_EMAIL_PROVIDER_TOKEN:-}
      RESCUE_MEAL_EMAIL_TIMEOUT_SECONDS: ${RESCUE_MEAL_EMAIL_TIMEOUT_SECONDS:-8}
      RESCUE_MEAL_EMAIL_MAX_ATTEMPTS: ${RESCUE_MEAL_EMAIL_MAX_ATTEMPTS:-2}
      RESCUE_MEAL_EMAIL_RETRY_BACKOFF_SECONDS: ${RESCUE_MEAL_EMAIL_RETRY_BACKOFF_SECONDS:-0.15}
      RESCUE_MEAL_VAPID_PRIVATE_KEY: ${RESCUE_MEAL_VAPID_PRIVATE_KEY:-}
      RESCUE_MEAL_VAPID_SUBJECT: ${RESCUE_MEAL_VAPID_SUBJECT:-}
      RESCUE_MEAL_PUSH_TIMEOUT_SECONDS: ${RESCUE_MEAL_PUSH_TIMEOUT_SECONDS:-8}
      RESCUE_MEAL_PUSH_TTL_SECONDS: ${RESCUE_MEAL_PUSH_TTL_SECONDS:-600}
      RESCUE_MEAL_PUSH_MAX_ATTEMPTS: ${RESCUE_MEAL_PUSH_MAX_ATTEMPTS:-3}
      RESCUE_MEAL_NOTIFICATION_WORKER_TOKEN: ${RESCUE_MEAL_NOTIFICATION_WORKER_TOKEN:-}
      RESCUE_MEAL_ENABLE_EXTERNAL_LOOKUPS: ${RESCUE_MEAL_ENABLE_EXTERNAL_LOOKUPS:-false}
      RESCUE_MEAL_PRODUCT_LOOKUP_TIMEOUT_SECONDS: ${RESCUE_MEAL_PRODUCT_LOOKUP_TIMEOUT_SECONDS:-4}
      RESCUE_MEAL_PRODUCT_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_CACHE_TTL_SECONDS:-604800}
      RESCUE_MEAL_PRODUCT_NEGATIVE_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_NEGATIVE_CACHE_TTL_SECONDS:-900}
      RESCUE_MEAL_PRODUCT_FAILURE_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_FAILURE_CACHE_TTL_SECONDS:-60}
      RESCUE_MEAL_PRODUCT_CACHE_MAX_ENTRIES: ${RESCUE_MEAL_PRODUCT_CACHE_MAX_ENTRIES:-2000}
      RESCUE_MEAL_PRODUCT_CACHE_NAMESPACE: ${RESCUE_MEAL_PRODUCT_CACHE_NAMESPACE:-product-master-v3}
      RESCUE_MEAL_PROVIDER_RATE_LIMIT_MAX_REQUESTS: ${RESCUE_MEAL_PROVIDER_RATE_LIMIT_MAX_REQUESTS:-10}
      RESCUE_MEAL_PROVIDER_RATE_LIMIT_WINDOW_SECONDS: ${RESCUE_MEAL_PROVIDER_RATE_LIMIT_WINDOW_SECONDS:-60}
      RESCUE_MEAL_PRODUCT_SINGLE_FLIGHT_LEASE_SECONDS: ${RESCUE_MEAL_PRODUCT_SINGLE_FLIGHT_LEASE_SECONDS:-45}
      RESCUE_MEAL_PRODUCT_SINGLE_FLIGHT_WAIT_SECONDS: ${RESCUE_MEAL_PRODUCT_SINGLE_FLIGHT_WAIT_SECONDS:-5}
      RESCUE_MEAL_PRODUCT_NAME_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_NAME_CACHE_TTL_SECONDS:-86400}
      RESCUE_MEAL_PRODUCT_NAME_CACHE_NAMESPACE: ${RESCUE_MEAL_PRODUCT_NAME_CACHE_NAMESPACE:-product-name-v1}
      RESCUE_MEAL_PRODUCT_NAME_NEGATIVE_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_NAME_NEGATIVE_CACHE_TTL_SECONDS:-600}
      RESCUE_MEAL_PRODUCT_NAME_FAILURE_CACHE_TTL_SECONDS: ${RESCUE_MEAL_PRODUCT_NAME_FAILURE_CACHE_TTL_SECONDS:-60}
      RESCUE_MEAL_PRODUCT_NAME_CACHE_MAX_ENTRIES: ${RESCUE_MEAL_PRODUCT_NAME_CACHE_MAX_ENTRIES:-1000}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN:-}
      RESCUE_MEAL_OPEN_FOOD_FACTS_BASE_URL: ${RESCUE_MEAL_OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org}
      RESCUE_MEAL_OPEN_FOOD_FACTS_USER_AGENT: ${RESCUE_MEAL_OPEN_FOOD_FACTS_USER_AGENT:-rescue-meal/0.1 (contact@example.com)}
      RESCUE_MEAL_MFDS_BASE_URL: ${RESCUE_MEAL_MFDS_BASE_URL:-https://openapi.foodsafetykorea.go.kr}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
      GROCY_BASE_URL: ${GROCY_BASE_URL:-}
      GROCY_API_KEY: ${GROCY_API_KEY:-}
      GROCY_TIMEOUT_SECONDS: ${GROCY_TIMEOUT_SECONDS:-5}
      RESCUE_MEAL_GROCY_WORKER_TOKEN: ${RESCUE_MEAL_GROCY_WORKER_TOKEN:-}
      FOODSAFETY_COOKRCP_API_KEY: ${FOODSAFETY_COOKRCP_API_KEY:-}
      FOODSAFETY_COOKRCP_BASE_URL: ${FOODSAFETY_COOKRCP_BASE_URL:-https://openapi.foodsafetykorea.go.kr}
      FOODSAFETY_COOKRCP_TIMEOUT_SECONDS: ${FOODSAFETY_COOKRCP_TIMEOUT_SECONDS:-8}
      RESCUE_MEAL_RECIPE_REVIEW_TOKEN: ${RESCUE_MEAL_RECIPE_REVIEW_TOKEN:-}
      RESCUE_MEAL_RECIPE_ADMIN_EMAILS: ${RESCUE_MEAL_RECIPE_ADMIN_EMAILS:-}
      RESCUE_MEAL_RECIPE_PUBLISHER_EMAILS: ${RESCUE_MEAL_RECIPE_PUBLISHER_EMAILS:-}
      RESCUE_MEAL_RECIPE_REVIEW_CLAIM_TTL_SECONDS: ${RESCUE_MEAL_RECIPE_REVIEW_CLAIM_TTL_SECONDS:-3600}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ocr-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  grocy-worker:
    profiles: ["grocy"]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "scripts/run_grocy_worker.py"]
    environment:
      RESCUE_MEAL_API_BASE_URL: http://api:8000
      RESCUE_MEAL_GROCY_WORKER_TOKEN: ${RESCUE_MEAL_GROCY_WORKER_TOKEN:-}
      RESCUE_MEAL_GROCY_WORKSPACE_IDS: ${RESCUE_MEAL_GROCY_WORKSPACE_IDS:-demo}
      RESCUE_MEAL_GROCY_WORKER_ID: ${RESCUE_MEAL_GROCY_WORKER_ID:-}
      RESCUE_MEAL_GROCY_WORKER_INTERVAL_SECONDS: ${RESCUE_MEAL_GROCY_WORKER_INTERVAL_SECONDS:-30}
      RESCUE_MEAL_GROCY_WORKER_LEASE_SECONDS: ${RESCUE_MEAL_GROCY_WORKER_LEASE_SECONDS:-120}
      RESCUE_MEAL_GROCY_STALE_AFTER_SECONDS: ${RESCUE_MEAL_GROCY_STALE_AFTER_SECONDS:-900}
      RESCUE_MEAL_GROCY_PROCESS_LIMIT: ${RESCUE_MEAL_GROCY_PROCESS_LIMIT:-20}
    depends_on:
      api:
        condition: service_healthy

  notification-worker:
    profiles: ["notifications"]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "scripts/run_notification_worker.py"]
    environment:
      RESCUE_MEAL_API_BASE_URL: http://api:8000
      RESCUE_MEAL_NOTIFICATION_WORKER_TOKEN: ${RESCUE_MEAL_NOTIFICATION_WORKER_TOKEN:-}
      RESCUE_MEAL_NOTIFICATION_WORKSPACE_IDS: ${RESCUE_MEAL_NOTIFICATION_WORKSPACE_IDS:-demo}
      RESCUE_MEAL_NOTIFICATION_WORKER_ID: ${RESCUE_MEAL_NOTIFICATION_WORKER_ID:-}
      RESCUE_MEAL_NOTIFICATION_WORKER_INTERVAL_SECONDS: ${RESCUE_MEAL_NOTIFICATION_WORKER_INTERVAL_SECONDS:-30}
      RESCUE_MEAL_NOTIFICATION_WORKER_LEASE_SECONDS: ${RESCUE_MEAL_NOTIFICATION_WORKER_LEASE_SECONDS:-120}
      RESCUE_MEAL_NOTIFICATION_STALE_AFTER_SECONDS: ${RESCUE_MEAL_NOTIFICATION_STALE_AFTER_SECONDS:-900}
      RESCUE_MEAL_NOTIFICATION_PROCESS_LIMIT: ${RESCUE_MEAL_NOTIFICATION_PROCESS_LIMIT:-20}
    depends_on:
      api:
        condition: service_healthy

  product-enrichment-worker:
    profiles: ["product-enrichment"]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "scripts/run_product_enrichment_worker.py"]
    environment:
      RESCUE_MEAL_API_BASE_URL: http://api:8000
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_TOKEN:-}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKSPACE_IDS: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKSPACE_IDS:-demo}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_ID: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_ID:-}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_INTERVAL_SECONDS: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_INTERVAL_SECONDS:-30}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_LEASE_SECONDS: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_WORKER_LEASE_SECONDS:-120}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_STALE_AFTER_SECONDS: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_STALE_AFTER_SECONDS:-900}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_PROCESS_LIMIT: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_PROCESS_LIMIT:-5}
      RESCUE_MEAL_PRODUCT_ENRICHMENT_MAX_ATTEMPTS: ${RESCUE_MEAL_PRODUCT_ENRICHMENT_MAX_ATTEMPTS:-3}
    depends_on:
      api:
        condition: service_healthy

volumes:
  rescue_meal_pgdata:
  rescue_meal_paddlex_cache:
