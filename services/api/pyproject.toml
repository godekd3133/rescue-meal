[project]
name = "rescue-meal-api"
version = "0.1.0"
description = "Safety-aware inventory and rescue meal API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "ortools>=9.12,<10",
  "Pillow>=12,<13",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "psycopg[binary,pool]>=3.2,<4",
  "pywebpush>=2.5,<3",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.1,<2027",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
